<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ration Shop System</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Nunito,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .wrap{max-width:500px;width:100%;text-align:center;}
    .logo{width:80px;height:80px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;margin:0 auto 20px;box-shadow:0 8px 24px rgba(37,99,235,0.3);}
    h1{font-size:2rem;font-weight:800;color:#1a202c;margin-bottom:8px;}
    .sub{font-size:0.88rem;color:#718096;margin-bottom:36px;line-height:1.7;}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    a.card{background:white;border-radius:18px;padding:32px 20px;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,0.07);border:2px solid transparent;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:10px;}
    a.card:hover{border-color:#2563eb;transform:translateY(-3px);}
    .c-icon{font-size:2.8rem;}
    .c-title{font-size:1rem;font-weight:800;color:#1a202c;}
    .c-sub{font-size:0.78rem;color:#718096;}
    .c-tag{background:#eff6ff;color:#2563eb;font-size:0.7rem;font-weight:700;padding:3px 10px;border-radius:20px;}
    @media(max-width:400px){.cards{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">&#x1F3EA;</div>
  <h1>Ration Shop System</h1>
  <p class="sub">Public Distribution System &middot; &#x0BAA;&#x0BCA;&#x0BA4;&#x0BC1; &#x0BB5;&#x0BBF;&#x0BA8;&#x0BBF;&#x0BAF;&#x0BCB;&#x0B95; &#x0A85;&#x0BAE;&#x0BC8;&#x0BAA;&#x0BCD;&#x0BAA;&#x0BC1; &middot; &#x0930;&#x093E;&#x0936;&#x0928; &#x092A;&#x094D;&#x0930;&#x092C;&#x0902;&#x0927;&#x0928;</p>
  <div class="cards">
    <a href="/beneficiary/index.html" class="card">
      <div class="c-icon">&#x1F46A;</div>
      <div class="c-title">Beneficiary</div>
      <div class="c-sub">Check stock &amp; quota</div>
      <div class="c-tag">OTP Login</div>
    </a>
    <a href="/staff/index.html" class="card">
      <div class="c-icon">&#x1F3EA;</div>
      <div class="c-title">Staff Panel</div>
      <div class="c-sub">Manage shop &amp; stock</div>
      <div class="c-tag">Staff Login</div>
    </a>
  </div>
</div>
</body>
</html>
